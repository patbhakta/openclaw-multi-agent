name: openalgo-platform

services:
  # Caddy Web Server
  caddy:
    image: caddy:latest
    container_name: openalgo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8765:8765"
    volumes:
      - ./etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/logs:/var/log/caddy
      - ./caddy/certs:/etc/caddy/certs:ro
    networks:
      - openalgo-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: betting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: openalgo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openalgo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: openalgo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - openalgo-network

networks:
  openalgo-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
